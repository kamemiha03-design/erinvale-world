name: Build Erinvale

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build browser game
        run: npm run build
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: erinvale-browser-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
